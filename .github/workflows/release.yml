name: Build Windows installer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build self-contained runtime installer
        shell: pwsh
        run: ./build.ps1
      - name: Test Node worker and statistics
        shell: pwsh
        run: ./.build/app/runtime/node.exe --test tests/*.test.cjs
      - name: Native smoke tests
        shell: pwsh
        run: |
          $exe=Join-Path $PWD '.build/app/Codex用量统计.exe'
          foreach($test in @(@('--overlay-test', '.build/overlay'),@('--pricing-test', '.build/pricing.txt'),@('--dpi-test', '.build/dpi.txt'),@('--statistics-test', '.build/statistics.txt'))) {
            $process=Start-Process -FilePath $exe -ArgumentList $test -Wait -PassThru
            if($process.ExitCode -ne 0){throw 'Native test failed'}
          }
      - name: Publish installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag='v1.2.0'
          gh release view $tag *> $null
          if($LASTEXITCODE -ne 0){gh release create $tag --target '${{ github.sha }}' --title 'Codex用量统计 v1.2.0' --notes '圆环额度颜色平滑过渡：90%–100% 为绿色，50%–80% 为蓝色渐变，0%–10% 为红色；零额度使用淡红色底环。'}
          gh release upload $tag dist/CodexUsageUI-1.2.0-Setup-x64.exe dist/SHA256SUMS.txt --clobber
          if($LASTEXITCODE -ne 0){throw 'Release upload failed'}
