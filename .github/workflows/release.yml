name: Build Windows installer
on:
  push:
    branches: [main]
    paths: [build.ps1]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build self-contained runtime installer
        shell: pwsh
        run: |
          if($env:GITHUB_REF_TYPE -eq 'tag'){./build.ps1 -Version ($env:GITHUB_REF_NAME.Substring(1))}
          else{./build.ps1}
      - name: Test Node worker and statistics
        shell: pwsh
        run: ./.build/app/runtime/node.exe --test tests/*.test.cjs
      - name: Native smoke tests
        shell: pwsh
        run: |
          $exe=Join-Path $PWD '.build/app/Codex用量统计.exe'
          foreach($test in @(@('--overlay-test', '.build/overlay'),@('--pricing-test', '.build/pricing.txt'),@('--dpi-test', '.build/dpi.txt'),@('--statistics-test', '.build/statistics.txt'),@('--update-test', '.build/update.txt'),@('--smoke', '.build/smoke.txt'))) {
            $process=Start-Process -FilePath $exe -ArgumentList $test -WindowStyle Hidden -Wait -PassThru
            if($process.ExitCode -ne 0){throw 'Native test failed'}
          }
          $installer=Get-ChildItem -LiteralPath ./dist -Filter 'CodexUsageUI-*-Setup-x64.exe'
          ./tests/update-install.ps1 -InstallerPath $installer.FullName
      - name: Publish installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer=Get-ChildItem -LiteralPath ./dist -Filter 'CodexUsageUI-*-Setup-x64.exe'
          if($installer.Name -notmatch '^CodexUsageUI-(\d+\.\d+\.\d+)-Setup-x64\.exe$'){throw 'Unexpected installer name'}
          $tag='v'+$Matches[1]
          gh release view $tag *> $null
          if($LASTEXITCODE -eq 0){Write-Output "$tag already published"; exit 0}
          $target=@('--target',$env:GITHUB_SHA)
          if($env:GITHUB_REF_TYPE -eq 'tag'){$target=@('--verify-tag')}
          gh release create $tag $installer.FullName dist/SHA256SUMS.txt @target --title "Codex用量统计 $tag" --generate-notes
          if($LASTEXITCODE -ne 0){throw 'Release creation failed'}
