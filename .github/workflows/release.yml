name: Build Windows installer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build self-contained runtime installer
        shell: pwsh
        run: ./build.ps1
      - name: Test Node worker and statistics
        shell: pwsh
        run: ./.build/app/runtime/node.exe --test tests/*.test.cjs
      - name: Native smoke tests
        shell: pwsh
        run: |
          $exe=Join-Path $PWD '.build/app/Codex用量统计.exe'
          foreach($test in @(@('--overlay-test', '.build/overlay'),@('--pricing-test', '.build/pricing.txt'),@('--dpi-test', '.build/dpi.txt'),@('--statistics-test', '.build/statistics.txt'))) {
            $process=Start-Process -FilePath $exe -ArgumentList $test -Wait -PassThru
            if($process.ExitCode -ne 0){throw 'Native test failed'}
          }
      - name: Publish installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag='v1.1.0'
          gh release view $tag *> $null
          if($LASTEXITCODE -ne 0){gh release create $tag --target '${{ github.sha }}' --title 'Codex用量统计 v1.1.0' --notes '新增按模型 USD 估算、计价说明和表头样式修复；圆环失焦后随 Codex 保持显示，正常接受其他窗口遮挡。内置 Node.js；需已安装并登录客户端。金额为 API 标准价估算，非订阅实际扣费。'}
          gh release upload $tag dist/CodexUsageUI-1.1.0-Setup-x64.exe dist/SHA256SUMS.txt --clobber
          if($LASTEXITCODE -ne 0){throw 'Release upload failed'}
